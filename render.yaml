services:
  - type: web
    name: ethio-telecom-son-operations
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.migrate && uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: SON_DATABASE_URL
        value: sqlite:///./son-local.db
      - key: SON_JWT_SECRET
        generateValue: true
